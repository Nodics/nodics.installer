name: Installer Release Check

on:
  push:
    branches:
      - development
      - master
      - main
    tags:
      - v*
  pull_request:
    branches:
      - development
      - master
      - main

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Pack smoke test
        run: npm pack --dry-run
