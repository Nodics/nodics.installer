name: Installer Release Check

on:
  push:
    branches:
      - development
      - master
      - main
    tags:
      - v*
  pull_request:
    branches:
      - development
      - master
      - main

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Syntax check
        run: node --check src/installer.js
      - name: Self-check artifact
        run: node bin/nodics-installer.js --action=self-check --workspace=/tmp/nodics-installer-self-check --json > self-check.json
      - name: Local smoke artifact
        run: node bin/nodics-installer.js --action=plan --workspace=/tmp/nodics-installer-plan --application-name=CI --project-name=ci.startio --json > plan-smoke.json
      - name: Publish readiness
        run: npm run publish:check
      - name: Pack smoke test
        run: npm pack --dry-run --json > npm-pack.json
      - name: Upload release check artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-release-check-node-${{ matrix.node-version }}
          path: |
            self-check.json
            plan-smoke.json
            npm-pack.json
